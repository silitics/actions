name: Deploy Static Site
description: Deploy a static site to S3-compatible storage for hosting

inputs:
  domain:
    description: Domain name for the site (e.g., docs.silitics.com)
    required: true
  path:
    description: Relative site path (e.g., sidex); empty deploys the whole domain
    required: false
    default: ""
  source-dir:
    description: Directory containing the built site
    required: false
    default: dist
  s3-bucket:
    description: S3 bucket name
    required: false
    default: silitics-public-sites
  s3-endpoint:
    description: S3 endpoint URL
    required: false
    default: https://nbg1.your-objectstorage.com
  s3-access-key:
    description: S3 access key
    required: true
  s3-secret-key:
    description: S3 secret key
    required: true

outputs:
  version:
    description: Deployed version identifier
    value: ${{ steps.deploy.outputs.version }}
  archive:
    description: Archive filename
    value: ${{ steps.deploy.outputs.archive }}

runs:
  using: composite
  steps:
    - name: Deploy to S3
      id: deploy
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.s3-access-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-key }}
        SITE_DOMAIN: ${{ inputs.domain }}
        SITE_PATH: ${{ inputs.path }}
        SITE_SOURCE_DIR: ${{ inputs.source-dir }}
        SITE_BUCKET: ${{ inputs.s3-bucket }}
        SITE_ENDPOINT: ${{ inputs.s3-endpoint }}
      run: bash "$GITHUB_ACTION_PATH/deploy.sh"
