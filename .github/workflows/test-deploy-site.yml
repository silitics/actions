name: Test Site Deployment

on:
  push:
    branches: [main]
    paths:
      - deploy-site/**
      - .github/workflows/test-deploy-site.yml
  pull_request:
    paths:
      - deploy-site/**
      - .github/workflows/test-deploy-site.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 deploy-site/test_deploy.py
