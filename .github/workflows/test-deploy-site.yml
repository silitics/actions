name: Test Site Deployment

on:
  push:
    branches: [main]
    paths:
      - deploy-site/**
      - mise.toml
      - .github/workflows/test-deploy-site.yml
  pull_request:
    paths:
      - deploy-site/**
      - mise.toml
      - .github/workflows/test-deploy-site.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - run: mise run test
